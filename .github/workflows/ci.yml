name: Check marketplace backend
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kulturex_connect
      - run: npm run prisma:generate
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kulturex_connect
